name: osnova_pos
description: Каса та облік для OSNOVA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  esc_pos_utils_plus: ^2.0.4
  image: ^4.2.0
  path_provider: ^2.1.4
  share_plus: ^10.1.0
  webview_flutter: ^4.14.1
  google_fonts: ^8.2.1

ev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/OsnovaLogo.JPG"
  adaptive_icon_foreground: "assets/OsnovaLogo.JPG"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
